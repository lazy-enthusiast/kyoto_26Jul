<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>京都 2026 - 祇園祭獨旅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 配色方案：祇園祭與古都之夜 */
            --bg-color: #3E3C3A;       /* 煤竹色 - 背景 */
            --card-color: #E8E8E8;     /* 灰白 - 卡片 */
            --accent-color: #E95464;   /* 朱紅 - 強調/按鈕 */
            --text-on-dark: #FFFFFB;   /* 象牙白 - 深底文字 */
            --text-on-light: #2F2F2F;  /* 墨黑 - 淺底文字 */
            --menu-bg: #2b2a29;        /* 選單背景 */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-on-dark);
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 20px;
            background-color: rgba(62, 60, 58, 0.98);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            height: 60px;
        }
        header h1 { margin: 0; font-size: 1.2rem; font-family: "Shippori Mincho", serif; letter-spacing: 1px; }
        
        /* Header Icons Area */
        .header-icons { display: flex; gap: 20px; align-items: center; }
        .header-btn { color: var(--text-on-dark); font-size: 1.2rem; cursor: pointer; text-decoration: none; position: relative; }
        .header-btn i { transition: transform 0.2s; }
        .header-btn:active i { transform: scale(0.9); }
        .fan-btn i { color: var(--accent-color); }

        /* --- Main Content Area --- */
        main {
            flex: 1;
            overflow-y: hidden; /* 控制各頁面自己滾動 */
            position: relative;
        }

        /* 頁面通用樣式 */
        .page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto;
            padding: 0 0 80px 0; /* 留白給底部導航 */
            display: none; opacity: 0;
            transition: opacity 0.3s ease;
            background-color: var(--bg-color);
        }
        .page.active { display: block; opacity: 1; z-index: 10; }
        
        /* 子頁面 (Full Screen Sub-pages) - 覆蓋底部導航 */
        .sub-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 2000; /* 最高層級 */
            display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .sub-page.open { transform: translateX(0); }

        .sub-header {
            padding: 15px 20px;
            background: var(--menu-bg);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 15px;
        }
        .back-btn { font-size: 1.2rem; color: var(--accent-color); cursor: pointer; background: none; border: none; padding: 5px; }
        .sub-header h2 { margin: 0; font-size: 1.1rem; font-family: "Shippori Mincho", serif; }
        
        .sub-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* --- 1. 行程樣式 (Itinerary) --- */
        .date-selector-container {
            position: sticky; top: 0; background: var(--bg-color); z-index: 90;
            padding: 15px 20px 5px 20px; margin: 0 -20px 20px -20px;
            box-shadow: 0 5px 10px -5px rgba(0,0,0,0.3);
        }
        .date-selector { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; scrollbar-width: none; }
        .date-selector::-webkit-scrollbar { display: none; }
        
        .date-chip {
            background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 16px;
            white-space: nowrap; font-size: 0.85rem; cursor: pointer; color: #aaa;
            display: flex; flex-direction: column; align-items: center; min-width: 55px;
            transition: all 0.2s; border: 1px solid transparent;
        }
        .date-chip.active {
            background: var(--accent-color); color: #fff;
            box-shadow: 0 0 10px rgba(233, 84, 100, 0.4); transform: scale(1.05);
        }

        .timeline-item {
            position: relative; padding-left: 25px; padding-bottom: 30px;
            border-left: 2px solid rgba(233, 84, 100, 0.3);
        }
        .timeline-item:last-child { border-left: 2px solid transparent; padding-bottom: 0; }
        .timeline-item::before {
            content: ''; position: absolute; left: -6px; top: 18px;
            width: 10px; height: 10px; background: var(--accent-color);
            border-radius: 50%; box-shadow: 0 0 0 4px rgba(62, 60, 58, 1);
        }

        .card {
            background-color: var(--card-color); color: var(--text-on-light);
            border-radius: 12px; padding: 16px; margin-bottom: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer;
            position: relative;
        }
        .card:active { transform: scale(0.98); }
        .card-time { font-size: 0.85rem; color: var(--accent-color); font-weight: 700; display: block; margin-bottom: 6px; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px 0; font-family: "Shippori Mincho", serif; line-height: 1.4; }
        
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
        .card-tag { font-size: 0.7rem; background: #D0D0D0; padding: 3px 8px; border-radius: 4px; color: #444; }
        .card-tag.highlight { background: #ffe4e6; color: #d63345; border: 1px solid #fab1b8; }
        .card-tag.tips { background: #e0f2fe; color: #0369a1; }

        /* --- 2. 百寶箱主頁樣式 (Tools Hub) --- */
        .tools-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 10px;
        }
        .tool-btn {
            background: rgba(255,255,255,0.08); padding: 25px 15px;
            border-radius: 16px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer;
            transition: background 0.2s;
        }
        .tool-btn:active { background: rgba(255,255,255,0.15); }
        .tool-btn i { font-size: 2.2rem; color: var(--accent-color); margin-bottom: 12px; display: block; }
        .tool-btn span { font-size: 1rem; font-weight: 500; }
        
        /* --- 3. 清單與功能子頁面樣式 --- */
        .checklist-item {
            background: rgba(255,255,255,0.08); padding: 15px; margin-bottom: 12px;
            border-radius: 8px; display: flex; align-items: center; gap: 15px;
        }
        .checklist-item.checked { opacity: 0.5; }
        .checklist-item.checked span { text-decoration: line-through; }
        .checklist-item input { width: 22px; height: 22px; accent-color: var(--accent-color); }
        
        .rate-calc { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-top: 20px; }
        .rate-calc input {
            width: 100%; padding: 15px; margin: 10px 0; font-size: 1.2rem;
            background: rgba(0,0,0,0.3); border: 1px solid #555; color: white; border-radius: 8px; text-align: center;
        }
        
        .safety-block {
            text-align: center; padding: 30px 20px;
            background: linear-gradient(135deg, #2E4B71, #1a2e47);
            border-radius: 16px; margin-bottom: 20px;
        }

        /* --- Footer Nav --- */
        nav.bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background-color: var(--menu-bg);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .nav-item {
            color: #888; text-align: center; font-size: 0.75rem; cursor: pointer; width: 33%;
        }
        .nav-item i { display: block; font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-color); }

        /* --- Modal (行程詳情) --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000;
            justify-content: center; align-items: end;
            backdrop-filter: blur(3px);
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--card-color); color: var(--text-on-light);
            width: 100%; max-width: 600px; max-height: 85vh;
            border-radius: 20px 20px 0 0; padding: 25px;
            overflow-y: auto; position: relative;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: #888; cursor: pointer; }
        
        /* 詳情內文樣式 */
        .info-row { margin: 12px 0; display: flex; align-items: flex-start; gap: 12px; font-size: 0.95rem; line-height: 1.6; }
        .info-row i { color: var(--accent-color); margin-top: 4px; width: 20px; text-align: center; }
        .note-box {
            background: #f8f8f8; border-left: 4px solid var(--accent-color);
            padding: 15px; margin: 20px 0; border-radius: 0 8px 8px 0;
            font-size: 0.95rem; color: #333; line-height: 1.7;
        }
        .link-btn {
            display: inline-block; background: #eee; color: #333; 
            padding: 6px 12px; border-radius: 4px; text-decoration: none; 
            font-size: 0.85rem; margin-top: 5px; border: 1px solid #ccc;
        }
        .action-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            width: 100%; padding: 14px; margin-top: 20px;
            background: var(--accent-color); color: white;
            text-decoration: none; border-radius: 10px;
            font-weight: bold; font-size: 1rem; border: none; cursor: pointer;
        }

        #map-container { height: 100%; width: 100%; }

    </style>
</head>
<body>

    <header>
        <h1>KYOTO 2026</h1>
        <div class="header-icons">
            <a href="googletranslate://" onclick="checkTranslate()" class="header-btn" title="Google Translate">
                <i class="fa-solid fa-language"></i>
            </a>
            <a href="#" class="header-btn fan-btn" onclick="openToolsPage(); return false;">
                <i class="fa-solid fa-fan fa-spin" style="animation-duration: 10s;"></i>
            </a>
        </div>
    </header>

    <main>
        <div id="page-itinerary" class="page active">
            <div class="date-selector-container">
                <div class="date-selector" id="date-selector"></div>
            </div>
            <div class="timeline-container" id="timeline-container" style="padding: 20px;"></div>
            <div style="text-align:center; color:#666; font-size:0.8rem; margin:30px 0;">平安喜樂 • 滿載而歸</div>
        </div>

        <div id="page-map" class="page" style="padding:0; height:100%;">
            <div id="map-container"></div>
        </div>

        <div id="page-tools" class="page">
            <h2 style="text-align:center; margin: 30px 0 20px 0; font-family:'Shippori Mincho',serif;">旅人百寶箱</h2>
            <div class="tools-grid">
                <div class="tool-btn" onclick="openSubPage('packing')">
                    <i class="fa-solid fa-suitcase"></i>
                    <span>行李清單</span>
                </div>
                <div class="tool-btn" onclick="openSubPage('shopping')">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>購物清單</span>
                </div>
                <div class="tool-btn" onclick="openSubPage('rate')">
                    <i class="fa-solid fa-yen-sign"></i>
                    <span>匯率換算</span>
                </div>
                <div class="tool-btn" onclick="openSubPage('safety')">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>安全報平安</span>
                </div>
                <div class="tool-btn" onclick="openTipsModal()">
                    <i class="fa-regular fa-compass"></i>
                    <span>路痴救星</span>
                </div>
                <div class="tool-btn" onclick="alert('警察: 110\n消防: 119\n外交部: 800-0885-0885')">
                    <i class="fa-solid fa-phone-medical"></i>
                    <span>緊急聯絡</span>
                </div>
            </div>
        </div>

        <div id="subpage-packing" class="sub-page">
            <div class="sub-header">
                <button class="back-btn" onclick="closeSubPage('packing')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>行李清單</h2>
            </div>
            <div class="sub-content" id="packing-list-container">
                </div>
        </div>

        <div id="subpage-shopping" class="sub-page">
            <div class="sub-header">
                <button class="back-btn" onclick="closeSubPage('shopping')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>購物清單</h2>
            </div>
            <div class="sub-content" id="shopping-list-container">
                </div>
        </div>

        <div id="subpage-rate" class="sub-page">
            <div class="sub-header">
                <button class="back-btn" onclick="closeSubPage('rate')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>匯率換算</h2>
            </div>
            <div class="sub-content" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:80%;">
                <div class="rate-calc" style="width:100%;">
                    <label>日幣 (JPY)</label>
                    <input type="number" id="jpy-input" placeholder="¥" oninput="calcRate('jpy')">
                    <div style="text-align:center; font-size:1.5rem; margin:10px 0; color:var(--accent-color);">⇅</div>
                    <label>港幣 (HKD)</label>
                    <input type="number" id="hkd-input" placeholder="$" oninput="calcRate('hkd')">
                    <p style="text-align:center; opacity:0.6; font-size:0.8rem; margin-top:20px;">*預設匯率 0.052</p>
                </div>
            </div>
        </div>

        <div id="subpage-safety" class="sub-page">
            <div class="sub-header">
                <button class="back-btn" onclick="closeSubPage('safety')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2>安全功能</h2>
            </div>
            <div class="sub-content">
                <div class="safety-block" onclick="sendSafetyMessage()">
                    <i class="fa-brands fa-whatsapp" style="font-size:3rem; color:white; margin-bottom:15px;"></i>
                    <h3 style="margin:0 0 10px 0;">一鍵報平安 (WhatsApp)</h3>
                    <p style="opacity:0.8; margin:0;">按此發送位置給家人<br>(不會顯示緊急字眼)</p>
                </div>
                
                <h3 style="border-bottom:1px solid #555; padding-bottom:10px; margin-top:30px;">緊急資訊</h3>
                <div class="checklist-item" onclick="alert('撥打 110')">
                    <i class="fa-solid fa-shield-halved" style="color:var(--accent-color);"></i>
                    <span>警察局: 110</span>
                </div>
                <div class="checklist-item" onclick="alert('撥打 119')">
                    <i class="fa-solid fa-truck-medical" style="color:var(--accent-color);"></i>
                    <span>救護車/消防: 119</span>
                </div>
                <div class="checklist-item">
                    <i class="fa-solid fa-building-columns" style="color:var(--accent-color);"></i>
                    <span>駐日代表處: 03-3280-7111</span>
                </div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchMainPage('itinerary', this)">
            <i class="fa-solid fa-calendar-days"></i> 行程
        </div>
        <div class="nav-item" onclick="switchMainPage('map', this)">
            <i class="fa-solid fa-map"></i> 地圖
        </div>
        <div class="nav-item" onclick="openToolsPage()">
            <i class="fa-solid fa-fan"></i> 百寶箱
        </div>
    </nav>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div class="modal-header">
                <h2 id="modal-title">標題</h2>
                <span id="modal-type" class="sub">類型</span>
            </div>
            <div class="modal-body">
                <div class="info-row"><i class="fa-regular fa-clock"></i><span id="modal-time">時間</span></div>
                <div class="info-row"><i class="fa-solid fa-location-dot"></i><span id="modal-address">地址</span></div>
                <div class="note-box">
                    <div style="font-weight:bold; margin-bottom:8px; color:var(--accent-color);">攻略與 TIPS：</div>
                    <span id="modal-note">內容...</span>
                </div>
                <div id="modal-links" style="margin-bottom: 20px;"></div>
                <button class="action-btn" id="modal-map-btn"><i class="fa-solid fa-map-location-dot"></i> 開啟 Google Maps 導航</button>
            </div>
        </div>
    </div>

                "events": [
                    { time: "早餐 (8:00前)", title: "伏見稻荷大社", type: "景點", address: "伏見稻荷大社", note: "<b>攻略：</b>8點前到避人潮。走千本鳥居到「奧社」許願即可折返。", tags: ["神社", "拍照"] },
                    { time: "11:30 - 14:00", title: "藤岡酒造 (蒼空)", type: "品酒", address: "伏見區", note: "<b>必訪：</b>玻璃屋酒吧「酒蔵Bar En」。<br><b>必點：</b>蒼空純米大吟釀。", tags: ["清酒", "文青"] },
                    { time: "午餐", title: "Nagomi Ikeyan", type: "美食", address: "嵐山", note: "交通：京都站搭 JR嵯峨野線 到 嵯峨嵐山站。", link: "https://tabelog.com/en/", linkText: "Tabelog 預約", tags: ["嵐山"] },
                    { time: "14:00 - 16:00", title: "香道：天香堂", type: "體驗", address: "嵐山", note: "<b>體驗：</b>聞香或製作「匂袋」。Tatami室園景浪漫。", link: "https://tenkhodou.com/", linkText: "官網預約", tags: ["香氛"] },
                    { time: "加碼", title: "野宮神社", type: "景點", address: "嵐山竹林入口", note: "求良緣摸那塊黑色的「龜石」，許願一年內實現。", tags: ["結緣"] },
                    { time: "16:30 - 17:30", title: "業務超市", type: "購物", address: "業務超市", note: "<b>必買：</b>柚子胡椒醬。", tags: ["超市"] }
                ]
            },
            "day5": {
                "date": "7/19 (日)",
                "events": [
                    { time: "早餐", title: "Sentido", type: "美食", address: "烏丸御池", note: "<b>必點：</b>熱壓三明治。", tags: ["咖啡"] },
                    { time: "10:00 - 13:00", title: "錦市場 & 錦天滿宮", type: "景點", address: "錦市場", note: "<b>必買：</b>打田漬物(柴漬)。<br><b>酒鬼Tip：</b>去「津之喜酒舖」找老闆推薦酒。", tags: ["市場"] },
                    { time: "下午", title: "下鴨神社 & 河合神社", type: "景點", address: "出町柳", note: "<b>重點：</b>河合神社必買「鏡繪馬」畫臉祈求變美。", tags: ["神社", "美容"] },
                    { time: "晚餐", title: "Giro Giro Hitoshina", type: "美食", address: "松原通", note: "現代懷石料理，適合獨旅。", link: "https://tabelog.com/en/", linkText: "Tabelog 預約", tags: ["懷石"] }
                ]
            },
            "day6": {
                "date": "7/20 (一)",
                "events": [
                    { time: "上午", title: "京都文化博物館", type: "景點", address: "三條高倉", note: "欣賞舊銀行建築之美，逛工藝品店。", tags: ["藝文"] },
                    { time: "14:00 - 16:00", title: "JR京都伊勢丹", type: "購物", address: "京都站", note: "<b>香水：</b>Shiro / Aux Paradis。<br><b>超市：</b>551肉包、下鴨茶寮便當。", tags: ["百貨"] },
                    { time: "20:00 後", title: "後祭山鉾搭建", type: "祭典", address: "烏丸御池", note: "看職人「無釘」組裝大船鉾。", tags: ["後祭"] }
                ]
            },
            "day7": {
                "date": "7/21 (二)",
                "events": [
                    { time: "08:00 - 11:00", title: "東寺 弘法市 (古董市集)", type: "市集", address: "東寺", note: "<b>每月21日限定！</b>早8-9點去寶物多。買古董清酒杯(猪口)。", tags: ["市集", "尋寶"] },
                    { time: "下午", title: "Fresco / Life 超市", type: "購物", address: "二條城附近", note: "補充日常零食。", tags: ["超市"] },
                    { time: "18:00 - 23:00", title: "後祭宵山 (通人版)", type: "祭典", address: "烏丸御池", note: "買杯路邊冰鎮清酒，坐著聽祇園囃子，享受寧靜夏夜。", tags: ["宵山"] }
                ]
            },
            "day8": {
                "date": "7/22 (三)",
                "events": [
                    { time: "早餐", title: "Inoda Coffee 本店", type: "美食", address: "烏丸御池", note: "<b>必點：</b>京之朝食 (火腿+炒蛋+招牌咖啡)。", tags: ["老舖"] },
                    { time: "12:00 - 13:00", title: "最後採買", type: "購物", address: "京都站", note: "必買：阿闍梨餅 (軟糯紅豆餅)。", tags: ["伴手禮"] },
                    { time: "前往機場", title: "利木津巴士", type: "交通", address: "京都站八條口", note: "八條口搭車。", link: "https://www.klook.com/activity/1541-kix-airport-limousine-bus-transfer-kyoto/", linkText: "Klook 巴士票", tags: ["移動"] }
                ]
            }
        };

        const shoppingList = ["阿闍梨餅 (京都站)", "551 Horai 肉包 (伊勢丹)", "下鴨茶寮 便當 (伊勢丹)", "古董猪口杯 (弘法市)", "MY ONLY FRAGRANCE 香水", "Shiro / Aux Paradis 香氛", "打田漬物 柴漬 (錦市場)", "津之喜酒舖 限定清酒", "業務超市 柚子胡椒", "長刀鉾 粽 (護身符)"];
        const packingList = ["護照 & 影本", "ICOCA 卡 (充5000円)", "行動電源", "輕便雨傘/雨衣 (梅雨)", "防曬乳/帽子 (30度+)", "好走的鞋 (祭典步行)", "個人藥品", "網卡/漫遊"];

        // --- 初始化 ---
        function init() {
            renderDateSelector();
            renderTimeline("day1");
            renderLists();
        }

        // --- 核心導航邏輯 ---
        function switchMainPage(pageId, navEl) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            
            // 更新 Bottom Nav 狀態
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(navEl) navEl.classList.add('active');

            if(pageId === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        // 風車按鈕 / 百寶箱按鈕
        function openToolsPage() {
            switchMainPage('tools');
            // 讓底部導航的「百寶箱」亮起
            const toolsNav = document.querySelectorAll('.nav-item')[2];
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            toolsNav.classList.add('active');
        }

        // 子頁面邏輯
        function openSubPage(id) {
            document.getElementById('subpage-' + id).classList.add('open');
        }
        function closeSubPage(id) {
            document.getElementById('subpage-' + id).classList.remove('open');
        }

        // Google Translate Check
        function checkTranslate() {
            // 這只是一個簡單的跳轉，如果沒有安裝 App，瀏覽器可能會報錯或無反應
            setTimeout(() => {
                console.log("嘗試開啟 Google Translate App...");
            }, 500);
        }

        // --- 渲染邏輯 ---
        function renderDateSelector() {
            const container = document.getElementById('date-selector');
            container.innerHTML = '';
            Object.keys(scheduleData).forEach(dayKey => {
                const dayInfo = scheduleData[dayKey];
                const dayNum = dayKey.replace('day', '');
                const chip = document.createElement('div');
                chip.className = `date-chip ${dayKey === 'day1' ? 'active' : ''}`;
                chip.onclick = () => selectDay(dayKey, chip);
                chip.innerHTML = `<span class="day-num">D${dayNum}</span><span class="day-week">${dayInfo.date.split(' ')[0]}</span>`;
                container.appendChild(chip);
            });
        }

        function selectDay(dayKey, chipEl) {
            document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
            chipEl.classList.add('active');
            renderTimeline(dayKey);
        }

        function renderTimeline(dayKey) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = ''; 
            const dayTitle = document.createElement('h3');
            dayTitle.style.marginBottom = '20px'; dayTitle.style.marginLeft='10px';
            dayTitle.innerHTML = `<span style="color:var(--accent-color); font-family:'Shippori Mincho',serif;">${scheduleData[dayKey].date}</span>`;
            container.appendChild(dayTitle);

            scheduleData[dayKey].events.forEach(event => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                let tagsHtml = event.tags.map(t => {
                    let c = 'card-tag';
                    if(t.includes('必')||t.includes('重點')) c+=' highlight';
                    if(t.includes('路痴')||t.includes('Tips')) c+=' tips';
                    return `<span class="${c}">${t}</span>`;
                }).join('');
                item.innerHTML = `<div class="card" onclick='openEventModal(${JSON.stringify(event)})'>
                    <span class="card-time">${event.time}</span><h3 class="card-title">${event.title}</h3><div class="tags">${tagsHtml}</div></div>`;
                container.appendChild(item);
            });
        }

        function renderLists() {
            const sContainer = document.getElementById('shopping-list-container');
            shoppingList.forEach((item, idx) => sContainer.innerHTML += createCheckItem(item, 'shop'+idx));
            const pContainer = document.getElementById('packing-list-container');
            packingList.forEach((item, idx) => pContainer.innerHTML += createCheckItem(item, 'pack'+idx));
        }

        function createCheckItem(text, id) {
            return `<div class="checklist-item" onclick="toggleCheck(this)">
                <input type="checkbox" id="${id}"><label for="${id}" style="pointer-events:none;width:100%;"><span>${text}</span></label></div>`;
        }
        function toggleCheck(el) {
            const input = el.querySelector('input'); input.checked = !input.checked;
            el.classList.toggle('checked', input.checked);
        }

        // 匯率
        function calcRate(type) {
            const rate = 0.052; 
            const jpyEl = document.getElementById('jpy-input');
            const hkdEl = document.getElementById('hkd-input');
            if(type === 'jpy') hkdEl.value = (jpyEl.value * rate).toFixed(1);
            else jpyEl.value = (hkdEl.value / rate).toFixed(0);
        }

        // 安全
        function sendSafetyMessage() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    const link = `https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude},${pos.coords.longitude}`;
                    const msg = `Hello! 我在京都玩得很開心，現在位置在這裡：${link}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                }, () => window.open(`https://wa.me/?text=${encodeURIComponent("Hello! 我在京都玩得很開心！")}`, '_blank'));
            } else alert("瀏覽器不支援定位");
        }

        // 彈窗與路痴 TIPS
        function openEventModal(event) {
            document.getElementById('modal-title').innerText = event.title;
            document.getElementById('modal-type').innerText = event.type;
            document.getElementById('modal-time').innerText = event.time;
            document.getElementById('modal-address').innerText = event.address;
            document.getElementById('modal-note').innerHTML = event.note;
            const linkContainer = document.getElementById('modal-links'); linkContainer.innerHTML = '';
            if(event.link) linkContainer.innerHTML = `<a href="${event.link}" target="_blank" class="link-btn"><i class="fa-solid fa-link"></i> ${event.linkText || '查看詳情'}</a>`;
            const mapQuery = encodeURIComponent(event.address + " " + event.title);
            document.getElementById('modal-map-btn').onclick = () => window.open(`https://www.google.com/maps/search/?api=1&query=${mapQuery}`, '_blank');
            document.getElementById('detail-modal').classList.add('open');
        }
        function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }
        document.getElementById('detail-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        function openTipsModal() {
            const tips = `<p><strong>🧭 辨識方向：</strong>京都塔永遠在北邊。</p><p><strong>🚌 公車：</strong>後門上車，前門下車付款。</p><p><strong>🚶 AR 導航：</strong>善用 Google Maps Live View。</p><p><strong>🚕 計程車：</strong>迷路就搭！門自動開。</p>`;
            openEventModal({ title: "路痴救星 TIPS", type: "生存指南", time: "隨時", address: "整個京都", note: tips, tags: [] });
        }

        // 地圖
        var map = L.map('map-container').setView([35.0034, 135.7681], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        L.marker([34.9858, 135.7588]).addTo(map).bindPopup("京都車站");
        L.marker([35.0037, 135.7786]).addTo(map).bindPopup("八坂神社");
        L.marker([34.9346, 135.7593]).addTo(map).bindPopup("伏見酒造區");
        L.marker([35.0116, 135.6766]).addTo(map).bindPopup("嵐山");

        init();
    </script>
