<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-color: #3E3C3A;       /* 煤竹色 */
            --card-color: #E8E8E8;     /* 灰白 */
            --accent-color: #E95464;   /* 朱紅 */
            --text-on-dark: #FFFFFB;
            --text-on-light: #2F2F2F;
            --btn-tabelog: #FAD13D;
            --btn-booking: #2A9D8F;
            --weather-sun: #FDB813;
            --weather-rain: #5C8BC0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-on-dark);
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 15px 20px;
            background-color: var(--bg-color);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-family: 'Shippori Mincho', serif; font-size: 1.4rem; letter-spacing: 2px; }
        header .subtitle { font-size: 0.8rem; color: var(--accent-color); display: block; margin-top: -2px;}
        
        /* 風車按鈕 (Toolbox Trigger) */
        .toolbox-trigger {
            font-size: 1.4rem; color: var(--accent-color);
            cursor: pointer; transition: transform 0.5s;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .toolbox-trigger:active { transform: rotate(180deg); }

        /* --- Global Date Selector --- */
        .date-selector-container {
            background: var(--bg-color);
            padding: 5px 20px 15px 20px;
            z-index: 90;
            box-shadow: 0 4px 10px -5px rgba(0,0,0,0.5);
        }
        .date-selector {
            display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px;
            scrollbar-width: none;
        }
        .date-selector::-webkit-scrollbar { display: none; }
        
        .date-chip {
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 16px;
            min-width: 55px; text-align: center;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
            color: #aaa;
        }
        .date-chip span.day-num { font-size: 1rem; font-weight: bold; display: block; }
        .date-chip span.day-week { font-size: 0.7rem; }
        .date-chip.active {
            background: var(--accent-color); color: #fff;
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(233, 84, 100, 0.4);
        }

        /* --- Main Content --- */
        main {
            flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px;
            scroll-behavior: smooth;
        }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Cards & Timeline --- */
        .timeline-item {
            position: relative; padding-left: 25px; padding-bottom: 25px;
            border-left: 2px solid rgba(233, 84, 100, 0.3);
        }
        .timeline-item:last-child { border-left: color: transparent; }
        .timeline-item::before {
            content: ''; position: absolute; left: -6px; top: 18px;
            width: 10px; height: 10px; background: var(--accent-color);
            border-radius: 50%;
        }

        .card {
            background-color: var(--card-color); color: var(--text-on-light);
            border-radius: 12px; padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer;
            position: relative;
        }
        .card-time { font-size: 0.8rem; color: var(--accent-color); font-weight: 700; display: block; margin-bottom: 5px;}
        .card-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px 0; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-tag { font-size: 0.7rem; background: #D0D0D0; padding: 3px 8px; border-radius: 4px; color: #444; }

        /* --- Toolbox Overlay (Floating) --- */
        .toolbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; flex-direction: column; padding: 20px;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s;
        }
        .toolbox-overlay.open { display: flex; }
        .toolbox-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid #555; padding-bottom: 15px;
        }
        .toolbox-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            overflow-y: auto;
        }
        .tool-widget {
            background: rgba(255,255,255,0.1); border-radius: 12px; padding: 15px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .tool-widget i { font-size: 1.5rem; color: var(--accent-color); margin-bottom: 8px; display:block; }
        
        /* Rate Calculator in Toolbox */
        .rate-calc { display: flex; gap: 5px; align-items: center; margin-top: 5px; }
        .rate-calc input { 
            width: 100%; background: transparent; border: 1px solid #777; 
            color: white; padding: 5px; border-radius: 4px; text-align: center; 
        }

        /* --- Daily Weather Card --- */
        .daily-weather-card {
            background: linear-gradient(135deg, #4A4846, #2F2E2D);
            border-radius: 16px; padding: 25px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .dw-icon { font-size: 4rem; margin: 15px 0; }
        .dw-temp { font-size: 3rem; font-weight: bold; }
        .dw-loc { color: var(--accent-color); font-size: 1.2rem; letter-spacing: 1px; }

        /* --- Daily Shopping Section --- */
        .today-shopping {
            background: rgba(233, 84, 100, 0.1); border: 1px solid var(--accent-color);
            border-radius: 12px; padding: 15px; margin-bottom: 25px;
        }
        .today-shopping h4 { margin: 0 0 10px 0; color: var(--accent-color); font-size: 1rem; }

        /* --- Bottom Nav --- */
        nav.bottom-nav {
            position: fixed; bottom: 0; width: 100%; background-color: #2b2a29;
            display: flex; justify-content: space-around; padding: 12px 0 25px 0;
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-item {
            color: #888; text-align: center; font-size: 0.7rem; cursor: pointer; width: 25%;
            transition: color 0.2s;
        }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-color); }

        /* --- Map Container --- */
        #map-container { height: 100%; width: 100%; border-radius: 12px; }

        /* Checklist Styles */
        .checklist-item {
            background: rgba(255,255,255,0.08); padding: 12px; margin-bottom: 8px;
            border-radius: 8px; display: flex; align-items: center; gap: 10px;
        }
        .checklist-item input { accent-color: var(--accent-color); width: 18px; height: 18px;}
        .checklist-item.checked { opacity: 0.5; text-decoration: line-through; }

        /* Action Buttons */
        .action-btn {
            display: block; width: 100%; padding: 12px; margin-top: 10px;
            background: var(--accent-color); color: white; text-align: center;
            text-decoration: none; border-radius: 8px; border: none; font-weight: bold;
        }
        .tabelog-btn { background: var(--btn-tabelog); color: #333; }
        .booking-btn { background: var(--btn-booking); }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000;
            justify-content: center; align-items: end;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--card-color); color: var(--text-on-light);
            width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0;
            padding: 25px; overflow-y: auto;
        }
    </style>
</head>

            renderDailyWeather(dayKey);
            renderDailyMap(dayKey);
            renderDailyShopping(dayKey);
        }

        // 2. 渲染日期列
        function renderDateSelector() {
            const container = document.getElementById('date-selector');
            Object.keys(scheduleData).forEach(key => {
                const dayNum = key.replace('day', '');
                const dateShort = scheduleData[key].date.split(' ')[0];
                const div = document.createElement('div');
                div.className = 'date-chip';
                div.id = `chip-${key}`;
                div.innerHTML = `<span class="day-num">D${dayNum}</span><span class="day-week">${dateShort}</span>`;
                div.onclick = () => selectDay(key);
                container.appendChild(div);
            });
        }

        // 3. 渲染行程
        function renderTimeline(key) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = `<h3 style="margin-left:30px; color:var(--accent-color);">${scheduleData[key].date}</h3>`;
            
            scheduleData[key].events.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="card" onclick='openModal(${JSON.stringify(ev)})'>
                        <span class="card-time">${ev.time}</span>
                        <div class="card-title">${ev.title}</div>
                        <span class="card-tag">${ev.type}</span>
                    </div>`;
                container.appendChild(item);
            });
        }

        // 4. 渲染單日天氣
        function renderDailyWeather(key) {
            const w = scheduleData[key].weather;
            const container = document.getElementById('daily-weather-container');
            container.innerHTML = `
                <div class="daily-weather-card">
                    <div style="font-size:1.2rem; font-weight:bold;">${scheduleData[key].date}</div>
                    <div class="dw-loc"><i class="fa-solid fa-location-dot"></i> ${scheduleData[key].loc}</div>
                    <div class="dw-icon"><i class="fa-solid ${w.icon}" style="color:${w.icon.includes('rain')?'var(--weather-rain)':'var(--weather-sun)'}"></i></div>
                    <div class="dw-temp">${w.temp}</div>
                    <div style="background:rgba(255,255,255,0.1); padding:5px 10px; border-radius:20px; display:inline-block; margin-top:10px;">${w.desc}</div>
                </div>
            `;
        }

        // 5. 渲染單日購物提示
        function renderDailyShopping(key) {
            const tipDiv = document.getElementById('today-shopping-opportunity');
            const tipText = document.getElementById('today-shopping-text');
            const tip = scheduleData[key].shopTip;
            
            if(tip) {
                tipDiv.style.display = 'block';
                tipText.innerText = tip;
            } else {
                tipDiv.style.display = 'none';
            }
        }

        // 6. 地圖相關
        function initMap() {
            map = L.map('map-container').setView([34.9858, 135.7588], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function renderDailyMap(key) {
            // 清除舊標記
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const events = scheduleData[key].events;
            const bounds = [];

            events.forEach(ev => {
                if(ev.coords) {
                    const m = L.marker(ev.coords).addTo(map).bindPopup(ev.title);
                    markers.push(m);
                    bounds.push(ev.coords);
                }
            });

            // 自動縮放以顯示當天所有點
            if(bounds.length > 0) {
                map.fitBounds(bounds, {padding: [50, 50]});
            } else {
                // 如果當天沒座標，回京都站
                map.setView([34.9858, 135.7588], 13);
            }
        }

        // 7. 清單 & 工具箱
        function renderLists() {
            const sList = document.getElementById('shopping-list-container');
            shoppingList.forEach((item, i) => sList.innerHTML += createCheckItem(item, 'shop-'+i));
            
            const pList = document.getElementById('packing-list-container');
            packingList.forEach((item, i) => pList.innerHTML += createCheckItem(item, 'pack-'+i));
        }

        function createCheckItem(text, id) {
            return `<div class="checklist-item" onclick="toggleCheck(this)">
                <input type="checkbox" id="${id}">
                <label for="${id}" style="pointer-events:none; width:100%;">${text}</label>
            </div>`;
        }
        function toggleCheck(el) {
            const cb = el.querySelector('input');
            cb.checked = !cb.checked;
            el.classList.toggle('checked', cb.checked);
        }

        // 8. 介面互動
        function toggleToolbox() {
            document.getElementById('toolbox-overlay').classList.toggle('open');
        }

        function switchPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(id === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        function openModal(ev) {
            document.getElementById('modal-title').innerText = ev.title;
            document.getElementById('modal-type').innerText = ev.type;
            document.getElementById('modal-time').innerText = ev.time;
            document.getElementById('modal-address').innerText = ev.address;
            document.getElementById('modal-note').innerText = ev.note;
            document.getElementById('detail-modal').classList.add('open');
            
            const btnGroup = document.getElementById('modal-btn-group');
            btnGroup.innerHTML = '';
            
            // Google Maps
            const mapBtn = document.createElement('a');
            mapBtn.className = 'action-btn';
            mapBtn.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> Google Maps';
            mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.title + " " + ev.address)}`;
            mapBtn.target = "_blank";
            btnGroup.appendChild(mapBtn);

            // Tabelog
            if(ev.tabelogUrl) {
                const tb = document.createElement('a');
                tb.className = 'action-btn tabelog-btn';
                tb.innerHTML = '<i class="fa-solid fa-utensils"></i> Tabelog';
                tb.href = ev.tabelogUrl; tb.target = "_blank";
                btnGroup.appendChild(tb);
            }
            // Booking
            if(ev.bookingUrl) {
                const bb = document.createElement('a');
                bb.className = 'action-btn booking-btn';
                bb.innerHTML = '<i class="fa-solid fa-ticket"></i> 預訂 / 詳情';
                bb.href = ev.bookingUrl; bb.target = "_blank";
                btnGroup.appendChild(bb);
            }
        }
        function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }

        // 9. 匯率計算
        function calcRate(type) {
            const rate = 0.052; 
            const jpy = document.getElementById('jpy-input');
            const hkd = document.getElementById('hkd-input');
            if(type === 'jpy') hkd.value = (jpy.value * rate).toFixed(1);
            else jpy.value = (hkd.value / rate).toFixed(0);
        }
        
        // 10. 報平安
        function sendSafetyMessage() {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    const msg = encodeURIComponent(`我在京都玩得很開心，目前位置：${link}`);
                    window.open(`https://wa.me/?text=${msg}`, '_blank');
                },
                () => alert("無法定位")
            );
        }
    </script>
</body>
</html>
